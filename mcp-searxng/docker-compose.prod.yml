# Production: MCP server (embedded SearXNG) + browserless Chromium used by the
# scrape tool for JavaScript-rendered pages.
#
# The build context is the monorepo root because the Dockerfile needs
# talk-libs/ and .git/ (hence `context: ..`). Keep the Compose project
# directory at this file's folder: an external --project-directory would make
# `..` resolve outside the repository.
name: mcp-searxng

services:
  mcp:
    build:
      context: ..
      dockerfile: mcp-searxng/Dockerfile
    image: mcp-searxng:latest
    restart: unless-stopped
    environment:
      # CDP endpoint of the browser service. The app appends BROWSERLESS_TOKEN
      # as ?token=..., and the same value is used as TOKEN below.
      SCRAPE_RENDER_URL: ws://browser:3000
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN:-change-me}
      SCRAPE_RENDER_MODE: fallback
      SCRAPE_RENDER_TIMEOUT: 20s
      SCRAPE_RENDER_CONCURRENCY: "1"
      X_API_KEY: ${X_API_KEY:-}
      BASE_URL: ${BASE_URL:-}
      OAUTH_AUTHORIZATION_SERVER: ${OAUTH_AUTHORIZATION_SERVER:-}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-}

  browser:
    image: ghcr.io/browserless/chromium:v2.58.1
    restart: unless-stopped
    environment:
      # browserless v2 always requires a token (a random one is generated when
      # TOKEN is unset, which would break SCRAPE_RENDER_URL).
      TOKEN: ${BROWSERLESS_TOKEN:-change-me}
      CONCURRENT: "1"
      TIMEOUT: "30000"
    deploy:
      resources:
        limits:
          memory: 1G
