sonar.projectKey=pixime-net_talk-backend
sonar.organization=pixime-net

sonar.sources=talk-libs,talk,mcp-owm,mcp-playground,mcp-ign-nav,mcp-searxng
sonar.exclusions=**/bin/**,**/vendor/**,**/tmp/**

sonar.tests=talk-libs,talk,mcp-owm,mcp-playground,mcp-ign-nav,mcp-searxng
sonar.test.inclusions=**/*_test.go

# Ignore cognitive complexity rule on test files (Go table-driven tests are inherently complex)
sonar.issue.ignore.multicriteria=testCC
sonar.issue.ignore.multicriteria.testCC.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.testCC.resourceKey=**/*_test.go

sonar.go.coverage.reportPaths=\
  coverage-talk-libs/coverage.out,\
  coverage-talk/coverage.out,\
  coverage-mcp-owm/coverage.out,\
  coverage-mcp-playground/coverage.out,\
  coverage-mcp-ign-nav/coverage.out,\
  coverage-mcp-searxng/coverage.out
